name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build web app
        run: pnpm --filter @degamed/web build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_PLAY_ORIGIN: https://degamed-play.pages.dev
      - name: Build play sandbox
        run: pnpm --filter @degamed/play build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - uses: actions/upload-artifact@v4
        with:
          name: play-dist
          path: apps/play/dist

  deploy:
    # Deploys to Cloudflare's free tier on every push to main, once the secrets from docs/SETUP.md step 4 exist.
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping deploy: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (docs/SETUP.md step 4)."
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: steps.secrets.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          name: web-dist
          path: apps/web/dist
      - uses: actions/download-artifact@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          name: play-dist
          path: apps/play/dist
      - name: Deploy web app
        if: steps.secrets.outputs.ready == 'true'
        working-directory: apps/api
        run: |
          pnpm exec wrangler pages project create degamed --production-branch main || true
          pnpm exec wrangler pages deploy ../web/dist --project-name degamed --branch main
      - name: Deploy play sandbox
        if: steps.secrets.outputs.ready == 'true'
        working-directory: apps/api
        run: |
          pnpm exec wrangler pages project create degamed-play --production-branch main || true
          pnpm exec wrangler pages deploy ../play/dist --project-name degamed-play --branch main
      # Last, and allowed to fail on its own: a brand-new account must pick a workers.dev
      # subdomain once in the dashboard before the first Worker deploy works.
      - name: Deploy API worker
        if: steps.secrets.outputs.ready == 'true'
        continue-on-error: true
        run: pnpm --filter @degamed/api exec wrangler deploy
