name = "degamed-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Public, non-secret settings. Secrets (SUPABASE_SECRET_KEY, ANTHROPIC_API_KEY, PAYSTACK_SECRET_KEY)
# are added in the Cloudflare dashboard. See docs/SETUP.md step 3.6.
[vars]
ALLOWED_ORIGINS = "http://localhost:5173,https://degamed.pages.dev"
# Free hosted images per user per day.
ART_DAILY_LIMIT = "25"
# Free hosted AI game-building requests (create / edit / fix) per user per day.
AI_DAILY_LIMIT = "30"
# Workers AI text models (JSON mode). Spec tasks use the small model; code edits and repairs the big one.
# Costs and the free allowance are in docs/team/ai.md.
AI_TEXT_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"
AI_CODE_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

# Ping Supabase once a day so the free project never pauses for inactivity.
[triggers]
crons = ["17 6 * * *"]

# Cloudflare Workers AI: hosted image generation (FLUX.1 schnell) and game specs (Llama). Free tier: 10,000 neurons/day.
[ai]
binding = "AI"
