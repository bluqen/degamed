<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Describe a game and play it in under a minute. Change it by chatting, then share a link anyone can play on a phone or a PC."
    />
    <meta name="theme-color" content="#f6f6f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c11" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Link previews. Scrapers don't run JS, so per-game cards need the API to serve /p/* (see BOARD). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Degamed" />
    <meta property="og:title" content="Degamed: describe it, play it, share it" />
    <meta
      property="og:description"
      content="Type one sentence and play a game that looks like a real indie game in under a minute."
    />
    <meta property="og:image" content="/art/themes/sunlit-meadow.png" />
    <meta property="og:image:width" content="480" />
    <meta property="og:image:height" content="270" />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="preload"
      href="/fonts/plus-jakarta-sans-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/bricolage-grotesque-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // Pick the theme before first paint so there's no flash: a saved choice, else the system's.
      (function () {
        var pref = 'system';
        try {
          pref = localStorage.getItem('degamed.theme') || 'system';
        } catch (e) {}
        var dark =
          pref === 'dark' ||
          (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
    <title>Degamed: describe a game, play it, share it</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
